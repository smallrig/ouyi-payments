# 宝塔站点扩展：/www/server/panel/vhost/nginx/extension/payments.ouyishop.com/
# 静态根目录：/www/wwwroot/payments.ouyishop.com
# 浏览器同源 /api/* → 本机 payments-admin-service（登录 + 业务）

# SPA 入口不缓存
location = /index.html {
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  add_header Pragma "no-cache" always;
  add_header Expires "0" always;
}

# 业务 API（含 POST /api/auth/login）；勿再写 location /，主配置已有
location ^~ /api/ {
  proxy_pass http://127.0.0.1:3025;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  client_max_body_size 60m;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
}
